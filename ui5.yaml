specVersion: "3.0"
metadata:
  name: procurement.dashboard
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.suite.ui.microchart
    - name: sap.ui.table
    - name: sap.ui.export
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /sap
      configuration:
        baseUri: "http://localhost:8000"
        strictSSL: false
