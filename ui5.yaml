specVersion: "3.0"
metadata:
  name: procurement.dashboard
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.suite.ui.microchart
    - name: sap.ui.table
    - name: sap.ui.export
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: true
        backend:
          - path: /sap
            url: "https://172.17.19.24:44300"
            client: "100"
